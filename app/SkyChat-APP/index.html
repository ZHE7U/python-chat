<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SkyChat</title>
<style>
  html, body {
    height: 100%; margin: 0;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(900px 500px at 20% 0%, rgba(56,189,248,.28), transparent 60%),
      linear-gradient(160deg, #dff3ff 0%, #eaf8ff 55%, #f6fbff 100%);
    -webkit-user-select: none; user-select: none;
  }
  #splash {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    padding: 24px; text-align: center;
  }
  .logo { font-size: 46px; }
  h1 { margin: 0; font-size: 22px; color: #0f172a; letter-spacing: 1px; }
  .sub { color: #64748b; font-size: 13px; }
  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid #bae6fd; border-top-color: #0284c7;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #tip { min-height: 18px; font-size: 12px; color: #64748b; }
  #panel {
    display: none; width: 100%; max-width: 320px;
    flex-direction: column; gap: 12px; margin-top: 4px;
  }
  .err {
    color: #e11d48; font-size: 14px; line-height: 1.7;
    background: #fff; border: 1px solid #ffe4e6; border-radius: 12px;
    padding: 14px; box-shadow: 0 10px 26px rgba(2,132,199,.10);
  }
  #addr {
    padding: 11px 13px; font-size: 15px; text-align: center;
    border: 1.5px solid #bae6fd; border-radius: 10px; outline: none;
    -webkit-user-select: text; user-select: text;
  }
  #addr:focus { border-color: #38bdf8; box-shadow: 0 0 0 4px rgba(56,189,248,.16); }
  #retry {
    padding: 11px 0; font-size: 15px; font-weight: 600; color: #fff;
    border: 0; border-radius: 10px; letter-spacing: 1px;
    background: linear-gradient(135deg, #38bdf8, #0284c7);
    box-shadow: 0 10px 24px rgba(2,132,199,.28);
  }
  .small { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
<div id="splash">
  <div class="logo">🐍</div>
  <h1>SkyChat</h1>
  <div class="sub">正在连接聊天服务器…</div>
  <div class="spinner" id="spin"></div>
  <div id="tip"></div>
  <div id="panel">
    <div class="err" id="err">
      连不上服务器。<br>
      请确认手机和电脑连着同一个 Wi-Fi，并且电脑上的聊天服务已经启动。
    </div>
    <input id="addr" placeholder="例如 192.168.43.6:3000">
    <button id="retry">重新连接</button>
    <div class="small">默认地址已填好，换了网络才需要改</div>
  </div>
</div>
<script type="text/javascript">
"use strict";

var DEFAULT_ADDR = "192.168.43.6:3000";
var KEY = "skychat_server";

function getAddr() {
  var a = localStorage.getItem(KEY) || DEFAULT_ADDR;
  return a.replace(/^https?:\/\//i, "").replace(/\/+$/, "");
}

function toUrl(addr) {
  return "http://" + addr + "/";
}

function showError() {
  document.getElementById("spin").style.display = "none";
  document.getElementById("panel").style.display = "flex";
  document.getElementById("addr").value = getAddr();
}

function connect() {
  var url = toUrl(getAddr());
  document.getElementById("tip").textContent = "服务器：" + url;

  if (!window.plus) {
    return;   // 在普通浏览器里预览时不跳转，方便看界面
  }

  // 先用原生请求探一下服务器可达性，避免直接暴露 WebView 的报错页
  try {
    var xhr = new plus.net.XMLHttpRequest();
    xhr.timeout = 5000;
    xhr.open("GET", url);
    xhr.onload = function () {
      if (xhr.status >= 200 && xhr.status < 500) {
        location.replace(url);
      } else {
        showError();
      }
    };
    xhr.onerror = function () { showError(); };
    xhr.ontimeout = function () { showError(); };
    xhr.send();
  } catch (e) {
    showError();
  }
}

document.getElementById("retry").addEventListener("click", function () {
  var a = document.getElementById("addr").value.trim();
  if (!a) { return; }
  localStorage.setItem(KEY, a);
  document.getElementById("panel").style.display = "none";
  document.getElementById("spin").style.display = "block";
  document.getElementById("err").innerHTML =
    "连不上服务器。<br>请确认手机和电脑连着同一个 Wi-Fi，并且电脑上的聊天服务已经启动。";
  connect();
});

document.addEventListener("plusready", connect, false);
</script>
</body>
</html>
